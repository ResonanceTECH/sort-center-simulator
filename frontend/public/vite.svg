<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="190" y1="170" x2="850" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A85CF4"/>
      <stop offset="0.48" stop-color="#6F36D9"/>
      <stop offset="1" stop-color="#3E176D"/>
    </linearGradient>

    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E2C8FF"/>
      <stop offset="1" stop-color="#9B6FE3"/>
    </linearGradient>

    <linearGradient id="flow" x1="460" y1="270" x2="620" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B985F5"/>
      <stop offset="0.5" stop-color="#E0C1FF"/>
      <stop offset="1" stop-color="#A86AEF"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#6A2AB8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Transparent canvas -->
  <g filter="url(#softShadow)">
    <!-- Main rounded-square mark -->
    <rect x="192" y="176" width="640" height="640" rx="150" fill="url(#bg)"/>

    <!-- Thin network connections -->
    <path d="M512 300 L344 492" stroke="#F7F1FF" stroke-width="22" stroke-linecap="round" opacity="0.96"/>
    <path d="M512 300 L680 492" stroke="#F7F1FF" stroke-width="22" stroke-linecap="round" opacity="0.96"/>
    <path d="M344 492 L512 692" stroke="#F7F1FF" stroke-width="22" stroke-linecap="round" opacity="0.96"/>
    <path d="M680 492 L512 692" stroke="#F7F1FF" stroke-width="22" stroke-linecap="round" opacity="0.96"/>

    <!-- Curved inner flows -->
    <path d="M353 493
             C428 492, 487 445, 492 364
             C494 334, 503 318, 512 304
             C528 335, 531 382, 517 420
             C497 474, 432 516, 353 510 Z"
          fill="url(#flow)" opacity="0.98"/>

    <path d="M673 494
             C603 500, 547 542, 529 596
             C516 633, 513 663, 512 688
             C539 662, 557 633, 568 602
             C590 543, 625 510, 673 507 Z"
          fill="url(#flow)" opacity="0.98"/>

    <!-- Nodes -->
    <g>
      <circle cx="512" cy="300" r="72" fill="url(#node)"/>
      <circle cx="512" cy="300" r="33" fill="white"/>

      <circle cx="344" cy="492" r="72" fill="url(#node)"/>
      <circle cx="344" cy="492" r="33" fill="white"/>

      <circle cx="680" cy="492" r="72" fill="url(#node)"/>
      <circle cx="680" cy="492" r="33" fill="white"/>

      <circle cx="512" cy="692" r="72" fill="url(#node)"/>
      <circle cx="512" cy="692" r="33" fill="white"/>
    </g>
  </g>
</svg>
